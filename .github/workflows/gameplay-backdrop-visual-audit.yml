name: Gameplay backdrop visual audit

on:
  pull_request:
    paths:
      - 'src/app/gameplay-backdrops.js'
      - 'src/app/gameplay-fit.js'
      - 'src/design-system/gameplay-backdrops.css'
      - 'src/design-system/gameplay-fit.css'
      - 'src/content/backdrop-manifest.json'
      - 'src/content/level-manifest.json'
      - 'scripts/extract-dense-levels.mjs'
      - 'scripts/validate-compiled-levels.mjs'
      - 'mobile-enhancements.js'
      - 'sw.js'
      - 'tests/gameplay-backdrops.test.mjs'
      - 'tests/portrait-geometry.test.mjs'
      - 'scripts/capture-gameplay-backdrop-audit.mjs'
      - 'docs/second-brain/NEXT_ACTION.md'
      - '.github/workflows/gameplay-backdrop-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare generated build metadata
        run: |
          mkdir -p audit
          npm run prepare:build

      - name: Run repository checks
        run: |
          node --check scripts/capture-gameplay-backdrop-audit.mjs
          npm run check

      - name: Build verified browser bundle
        run: npm run build

      - name: Start clean local production server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/toxic-teddies-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/toxic-teddies-server.log
          exit 1

      - name: Render and audit portrait-native gameplay
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          URL='http://127.0.0.1:4173/?teddy=tt01&level=1&v=53'

          CHROME_BIN="$CHROME" node scripts/capture-gameplay-backdrop-audit.mjs \
            "$URL" audit/toxic-toby-portrait-mobile.png 430 764

          CHROME_BIN="$CHROME" node scripts/capture-gameplay-backdrop-audit.mjs \
            "$URL" audit/toxic-toby-portrait-desktop.png 1365 768

      - name: Verify captured runtime diagnostics
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          for (const name of ['mobile', 'desktop']) {
            const report = JSON.parse(await readFile(`audit/toxic-toby-portrait-${name}.json`, 'utf8'));
            if (report.error) throw new Error(`${name} audit failed: ${report.error.message}`);
            const d = report.diagnostics;
            if (!d?.splashHidden || !d?.gameVisible) throw new Error(`${name}: gameplay did not load cleanly`);
            if (d?.backdropMode !== 'generated-css') throw new Error(`${name}: frame mode ${d?.backdropMode}`);
            if (d?.computedBackgroundImage?.includes('/assets/backdrops/')) throw new Error(`${name}: raster backdrop still active`);
            if (d?.puzzleAspectPreserved !== 'true') throw new Error(`${name}: Teddy aspect preservation not locked`);
            if (!d?.puzzleInsideGame) throw new Error(`${name}: puzzle is clipped`);
            if (!(d?.boardWidthRatio >= 0.98)) throw new Error(`${name}: board width ratio ${d?.boardWidthRatio}`);
            if (Math.abs(d.puzzleAspectRatio - d.lockedAspectRatio) > 0.03) throw new Error(`${name}: Teddy is stretched`);
            if (!(d.lockedTallnessRatio >= 1.42 && d.lockedTallnessRatio <= 1.65)) {
              throw new Error(`${name}: authored Teddy tallness ${d.lockedTallnessRatio} is outside the portrait-native range`);
            }
            if (name === 'mobile') {
              if (!(d.puzzleWidthRatio >= 0.86)) throw new Error(`mobile: puzzle width ratio ${d.puzzleWidthRatio}`);
              if (!(d.puzzleHeightRatio >= 0.72)) throw new Error(`mobile: puzzle height ratio ${d.puzzleHeightRatio}`);
            } else {
              if (!(d.puzzleHeightRatio >= 0.82)) throw new Error(`desktop: puzzle height ratio ${d.puzzleHeightRatio}`);
              if (!(d.puzzleWidthRatio >= 0.28)) throw new Error(`desktop: puzzle width ratio ${d.puzzleWidthRatio}`);
            }
          }
          NODE

      - name: Record screenshot metadata
        shell: bash
        run: |
          file audit/toxic-toby-portrait-mobile.png audit/toxic-toby-portrait-desktop.png | tee audit/screenshot-metadata.txt
          stat -c '%n %s bytes' audit/toxic-toby-portrait-mobile.png audit/toxic-toby-portrait-desktop.png | tee -a audit/screenshot-metadata.txt
          cat /tmp/toxic-teddies-server.log > audit/server.log

      - name: Upload rendered audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toxic-toby-portrait-native-audit-v53
          path: audit/
          if-no-files-found: warn
          retention-days: 14
