name: Gameplay backdrop visual audit

on:
  pull_request:
    paths:
      - 'src/app/gameplay-backdrops.js'
      - 'src/design-system/gameplay-backdrops.css'
      - 'src/content/backdrop-manifest.json'
      - 'assets/backdrops/tt01/**'
      - 'mobile-enhancements.js'
      - 'sw.js'
      - 'tests/gameplay-backdrops.test.mjs'
      - 'scripts/capture-gameplay-backdrop-audit.mjs'
      - 'docs/second-brain/FAILURE_LEDGER.md'
      - 'docs/second-brain/NEXT_ACTION.md'
      - '.github/workflows/gameplay-backdrop-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare generated build metadata
        run: |
          mkdir -p audit
          npm run prepare:build

      - name: Run repository checks
        run: |
          node --check scripts/capture-gameplay-backdrop-audit.mjs
          npm run check

      - name: Build verified browser bundle
        run: npm run build

      - name: Start clean local production server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/toxic-teddies-server.log 2>&1 &
          echo $! > /tmp/toxic-teddies-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/toxic-teddies-server.log
          exit 1

      - name: Verify all five WebP assets are served correctly
        shell: bash
        run: |
          mkdir -p audit/assets
          for file in neutral evil-grin gross angry maniacal-laugh; do
            curl -fsS "http://127.0.0.1:4173/assets/backdrops/tt01/${file}.webp" -o "audit/assets/${file}.webp"
            test "$(head -c 4 "audit/assets/${file}.webp")" = "RIFF"
            test "$(dd if="audit/assets/${file}.webp" bs=1 skip=8 count=4 status=none)" = "WEBP"
          done

      - name: Render and audit gameplay after the intro handoff
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          URL='http://127.0.0.1:4173/?teddy=tt01&level=1&v=44'

          CHROME_BIN="$CHROME" node scripts/capture-gameplay-backdrop-audit.mjs \
            "$URL" audit/toxic-toby-neutral-mobile.png 430 764

          CHROME_BIN="$CHROME" node scripts/capture-gameplay-backdrop-audit.mjs \
            "$URL" audit/toxic-toby-neutral-desktop.png 1365 768

          test -s audit/toxic-toby-neutral-mobile.png
          test -s audit/toxic-toby-neutral-desktop.png

      - name: Verify captured runtime diagnostics
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          for (const name of ['mobile', 'desktop']) {
            const report = JSON.parse(await readFile(`audit/toxic-toby-neutral-${name}.json`, 'utf8'));
            if (report.error) throw new Error(`${name} audit failed: ${report.error.message}`);
            const d = report.diagnostics;
            if (!d?.splashHidden) throw new Error(`${name}: splash remained visible`);
            if (!d?.gameVisible) throw new Error(`${name}: game view is hidden`);
            if (d?.backdropStatus !== 'loaded') throw new Error(`${name}: backdrop status ${d?.backdropStatus}`);
            if (!d?.computedBackgroundImage?.includes('/assets/backdrops/tt01/neutral.webp')) {
              throw new Error(`${name}: incorrect computed background ${d?.computedBackgroundImage}`);
            }
            if (!(d?.pathCount > 0)) throw new Error(`${name}: no puzzle paths rendered`);
            if (!report.networkEvents.some(event => event.type === 'response' && event.url.endsWith('/neutral.webp') && event.status === 200)) {
              throw new Error(`${name}: neutral.webp did not return HTTP 200`);
            }
          }
          NODE

      - name: Record screenshot metadata
        shell: bash
        run: |
          file audit/toxic-toby-neutral-mobile.png audit/toxic-toby-neutral-desktop.png | tee audit/screenshot-metadata.txt
          stat -c '%n %s bytes' audit/toxic-toby-neutral-mobile.png audit/toxic-toby-neutral-desktop.png | tee -a audit/screenshot-metadata.txt
          cat /tmp/toxic-teddies-server.log > audit/server.log

      - name: Upload rendered audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toxic-toby-gameplay-backdrop-audit
          path: audit/
          if-no-files-found: warn
          retention-days: 14
